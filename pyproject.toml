[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citibike-stationpulse"
version = "0.1.0"
description = "Phan tich nhu cau Citi Bike va mat can bang xe tai tram bang PySpark"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CitiBike-StationPulse Team" }
]
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
